  "baseline_yaml_source": "trajectory_impact_sim:\n  ros__parameters:\n    control_rate_hz: 20.0\n    offboard_prestream_time: 2.0\n    px4_command_retry_time: 1.0\n    # Representative command envelope for the 2.1 kg PX4 X500 model.\n    max_speed: 7.0\n    max_acceleration: 3.5\n    max_actual_horizontal_acceleration: 4.0\n    horizontal_acceleration_guard_margin: 0.5\n    enable_maneuver_prediction: true\n    turn_rate_filter_alpha: 0.25\n    max_target_turn_rate: 0.7\n    # Bounded CTRA estimates changing curvature and speed without assuming a\n    # cooperative route or using future ground truth.\n    turn_acceleration_filter_alpha: 0.2\n    max_target_turn_acceleration: 1.5\n    speed_acceleration_filter_alpha: 0.2\n    max_target_longitudinal_acceleration: 2.0\n    maneuver_acceleration_decay_time: 1.0\n    maneuver_prediction_horizon: 2.0\n    minimum_target_speed: 0.2\n    intercept_guidance_horizon_min: 1.0\n    intercept_guidance_horizon_max: 2.0\n    intercept_guidance_horizon_distance: 20.0\n    intercept_position_gain: 0.8\n    intercept_reference_position_gain: 1.0\n    intercept_reference_max_speed: 6.2\n    intercept_reference_max_acceleration: 3.2\n    intercept_reference_max_vertical_acceleration: 2.5\n    terminal_radius: 3.0\n    terminal_closing_speed: 1.5\n    terminal_min_closing_speed: 0.3\n    terminal_closing_speed_step: 0.3\n    terminal_plan_duration_step: 0.1\n    # Reachability chooses the online interval.  Two seconds remains nominal;\n    # three seconds is a hard compute/mission cap, not a relaxed dynamic limit.\n    terminal_plan_absolute_max_duration: 3.0\n    terminal_plan_horizon_extra_margin: 0.5\n    # Three-piece minimum-jerk trajectory, replanned at the controller rate.\n    enable_minco_planner: true\n    minco_piece_count: 3\n    minco_target_curve_weight: 0.7\n    # GCOPTER-style spatial-temporal deformation: positive interval mapping,\n    # bounded intermediate-point deformation, and cubic integral penalties.\n    enable_minco_geometric_optimization: true\n    minco_optimization_max_iterations: 3\n    minco_spatial_radius: 0.75\n    minco_constraint_penalty_weight: 1000.0\n    minco_quadrature_intervals_per_piece: 8\n    terminal_control_lookahead: 0.15\n    # MINCO search costs tens of milliseconds; replan at 10 Hz and track the\n    # retained trajectory between searches instead of overrunning 20 Hz.\n    terminal_replan_period: 0.1\n    # Never follow a stale manoeuvring-target trajectory for a full horizon.\n    terminal_plan_max_hold_time: 0.2\n    terminal_plan_target_error_limit: 0.5\n    terminal_plan_min_remaining_time: 0.2\n    terminal_plan_failure_limit: 3\n    enable_async_terminal_planner: true\n    # Convert MINCO velocity feed-forward into closed-loop trajectory tracking.\n    terminal_trajectory_position_gain: 1.2\n    terminal_trajectory_vertical_gain: 1.2\n    terminal_contact_clearance: 0.05\n    # Release terminal descent only after the target opens beyond this range.\n    terminal_descent_release_distance: 4.0\n    # Geometric flight-path angle relative to the moving capture point.\n    terminal_dive_angle: 0.78539816339\n    # Preferred terminal clearance above the sea surface.  It is relaxed only\n    # when needed to preserve an intersection with the capture sphere.\n    terminal_minimum_clearance: 0.1\n    # Include command/vehicle response distance in the all-path sea barrier.\n    terminal_safety_response_time: 0.15\n    terminal_safety_margin: 0.02\n    terminal_safety_warning_margin: 0.15\n    # Conservative effective PX4 vertical braking authority used by both the\n    # reachability gate and final post-limiter sea barrier.\n    terminal_effective_vertical_braking_acceleration: 2.5\n    front_camera_max_depression_angle: 0.85\n    terminal_max_acceleration: 3.0\n    terminal_max_vertical_acceleration: 3.0\n    impact_radius: 0.25\n    enable_sea_contact_failure: true\n    sea_surface_z: 0.0\n    max_sim_duration: 30.0\n    state_timeout: 0.5\n    vehicle_status_timeout: 2.0\n    mode_loss_grace_time: 0.5\n    constraint_violation_duration: 0.25\n    enable_gazebo_control: true\n    flight_altitude: -5.0\n    takeoff_tolerance: 0.5\n    takeoff_settle_time: 1.0\n    # Keep horizontal tracking during launch, but avoid large tilt/thrust steps.\n    takeoff_max_horizontal_acceleration: 1.5\n    takeoff_max_vertical_speed: 1.5\n    takeoff_max_vertical_acceleration: 1.0\n    # Do not pitch for translation until the vehicle is safely airborne.\n    takeoff_horizontal_start_height: 0.5\n    takeoff_horizontal_full_height: 1.5\n    follow_distance: 5.0\n    follow_position_gain: 0.8\n    follow_max_closing_speed: 1.5\n    # Retained only for backward-compatible parameter loading.  MINCO failure\n    # no longer enters a high-speed terminal-pursuit fallback.\n    terminal_pursuit_max_closing_speed: 3.0\n    follow_max_acceleration: 2.5\n    altitude_velocity_gain: 1.0\n    # A 4 m/s descent paired with the 4 m/s USV baseline permits a\n    # 45-degree terminal flight-path angle without relaxing XY limits.\n    max_vertical_speed: 4.0\n    max_vertical_acceleration: 3.0\n    max_actual_vertical_acceleration: 4.0\n    speed_guard_margin: 0.5\n    speed_governor_gain: 1.0\n    max_observation_yaw_rate: 1.0\n\nmoving_target:\n  ros__parameters:\n    # Eight metres gives a roughly 23-pixel target diameter at startup.\n    initial_x: 8.0\n    initial_y: 0.0\n    initial_z: 0.0\n    velocity_x: 0.0\n    velocity_y: 4.0\n    velocity_z: 0.0\n    trajectory_type: figure_eight\n    horizontal_speed: 4.0\n    horizontal_acceleration_limit: 1.0\n    maximum_turn_rate: 0.65\n    maximum_lateral_acceleration: 3.2\n    figure_eight_x_amplitude: 40.0\n    figure_eight_y_amplitude: 20.0\n    vertical_oscillation_amplitude: 0.15\n    vertical_oscillation_frequency: 0.25\n    update_rate_hz: 20.0\n    start_on_command: true\n    enable_gazebo_visualization: true\n    gazebo_world_name: default\n    gazebo_entity_name: usv_target\n    gazebo_sphere_diameter: 0.5\n    # Radius 0.25 m + heave amplitude 0.15 m + 0.02 m clearance.\n    gazebo_visual_height_offset: 0.42\n    pause_gazebo_on_hit: true\n\ntarget_kalman_filter:\n  ros__parameters:\n    frame_id: local_ned\n    # Camera-derived positions are filtered; truth remains evaluation-only.\n    input_topic: /perception/front/target_position\n    state_topic: /tracking/target_state\n    prediction_topic: /tracking/predicted_position\n    update_rate_hz: 20.0\n    process_acceleration_std: 1.5\n    measurement_position_std: 0.25\n    initial_velocity_std: 5.0\n    prediction_horizon: 0.5\n    measurement_timeout: 0.5\n\nrgbd_target_localizer:\n  ros__parameters:\n    color_topic: /camera/front/image_raw\n    depth_topic: /camera/front/depth/image_raw\n    observation_topic: /perception/front/target_observation\n    position_topic: /perception/front/target_position\n    frame_id: local_ned\n    horizontal_fov: 1.74\n    minimum_red_pixels: 3\n    minimum_depth: 0.2\n    maximum_depth: 25.0\n    minimum_depth_ratio: 0.5\n    maximum_rgb_depth_skew: 0.1\n    data_timeout: 0.5\n    localization_rate_hz: 20.0\n    camera_pitch_down: 0.20944\n    camera_translation_x: 0.35\n    camera_translation_y: 0.0\n    camera_translation_z: -0.05\n    target_radius: 0.25\n    target_reference_z_offset: 0.42\n    base_position_std: 0.08\n    range_position_std_scale: 0.01\n\nfront_tof_monitor:\n  ros__parameters:\n    camera_name: front\n    diagnostic_prefix: /perception/front\n    camera_frame_id: front_camera_optical_frame\n    color_gazebo_topic: /uav/camera/front/image\n    depth_gazebo_topic: /uav/camera/front/depth_image\n    color_ros_topic: /camera/front/image_raw\n    depth_ros_topic: /camera/front/depth/image_raw\n    horizontal_fov: 1.74\n    minimum_red_pixels: 3\n    minimum_target_depth_ratio: 0.5\n    image_timeout: 0.5\n    maximum_rgb_depth_skew: 0.1\n    minimum_rgb_distance: 0.2\n    maximum_rgb_distance: 60.0\n    minimum_depth: 0.2\n    maximum_depth: 25.0\n    evaluation_window_seconds: 5.0\n    camera_pitch_down: 0.20944\n    target_visual_height_offset: 0.42\n    analysis_rate_hz: 10.0\n\ndual_tof_selector:\n  ros__parameters:\n    switch_loss_frames: 3\n    front_recovery_frames: 10\n    allow_down_fallback: false\n    selection_rate_hz: 10.0\n"
}
