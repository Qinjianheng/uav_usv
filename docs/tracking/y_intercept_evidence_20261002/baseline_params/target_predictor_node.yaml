/target_predictor_node:
  ros__parameters:
    frame_id: local_ned
    input_timeout: 0.125
    maneuver_acceleration_decay_time: 1.0
    maneuver_prediction_horizon: 2.0
    max_target_longitudinal_acceleration: 2.0
    max_target_turn_acceleration: 1.5
    max_target_turn_rate: 0.7
    maximum_vertical_displacement: 0.5
    minimum_target_speed: 0.2
    minimum_turn_updates: 3
    prediction_horizon: 4.0
    prediction_sample_period: 0.1
    prediction_topic: /planning/target_prediction
    speed_acceleration_filter_alpha: 0.2
    target_state_source: tracking
    tracking_topic: /tracking/target_state
    turn_acceleration_filter_alpha: 0.2
    turn_rate_filter_alpha: 0.25
    update_rate_hz: 20.0
    use_sim_time: false
    vertical_history_window: 1.0
    vertical_observation_margin: 0.25
    vertical_velocity_decay_time: 0.75
