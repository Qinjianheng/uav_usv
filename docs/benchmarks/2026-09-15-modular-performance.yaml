benchmark:
  date: "2026-09-15"
  scope: "synthetic CPU performance and process-isolation validation"
  warning: >-
    These measurements are not Gazebo interception trials and do not establish
    interception success rate.

environment:
  ros_distribution: humble
  python: "3.10"
  workspace: "/home/qin/data/uav_usv"

fast_minco:
  runs: 200
  random_seed: 20260915
  target_speed_mps: 4.0
  target_motion: "bounded constant-turn cases with bounded vertical motion"
  realtime_lbfgs_enabled: false
  candidate_limit: 6
  observed_candidate_maximum: 4
  observed_candidate_mean: 1.300
  outcomes:
    DEADLINE_EXCEEDED: 25
    DYNAMIC_LIMIT_HORIZONTAL: 36
    DYNAMIC_LIMIT_VERTICAL: 8
    HORIZON_INSUFFICIENT: 131
  planner_time_ms:
    p50: 41.031
    p95: 76.668
    maximum: 94.635
  generation_time_ms:
    p50: 0.000
    p95: 15.815
    maximum: 19.632
  acceptance:
    generation_p95_below_30_ms: true
    planner_p95_below_80_ms: true
    planner_maximum_below_100_ms: true
    cpp_migration_required_by_current_gate: false

trajectory_tracker:
  callbacks: 10000
  operation: "polynomial sample + feedback + final Safety Guard + PX4 conversion"
  callback_time_ms:
    p50: 0.0239
    p95: 0.0259
    maximum: 0.6467
  acceptance:
    p95_below_10_ms: true

process_isolation:
  planner_load: "five CPU-bound bursts of 200 ms in a separate process"
  tracker_period_target_ms: 50.0
  observed_ticks: 20
  observed_frequency_hz: 19.964
  interval_ms:
    p50: 50.072
    p95: 50.187
    maximum: 50.190
  acceptance:
    maintained_20_hz: true
